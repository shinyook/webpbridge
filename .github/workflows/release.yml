name: Release candidate and Maven Central
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true
        default: '0.1.0'
        type: string
      publish:
        description: Publish to Maven Central (requires a matching vVERSION tag and secrets)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      timestamp: ${{ steps.version.outputs.timestamp }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Expected a stable MAJOR.MINOR.PATCH version')
          if os.environ['PUBLISH'] == 'true' and os.environ['GITHUB_REF'] != 'refs/tags/v' + version:
              raise SystemExit('Publishing must run from the matching vVERSION tag')
          PY
          echo "timestamp=$(git show -s --format=%ct)" >> "$GITHUB_OUTPUT"
  native:
    needs: validate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
          - os: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 3
      - run: cmake --install build --config Release --prefix target/classes --component webpjni
      - run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        with:
          name: release-native-${{ matrix.platform }}
          path: |
            target/classes/native/
            target/classes/META-INF/licenses/libwebp/
          if-no-files-found: error
  assemble:
    needs: [validate, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          pattern: release-native-*
          path: native-input
      - run: python3 scripts/assemble_natives.py native-input target/classes
      - shell: bash
        run: |
          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.19.1:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode -Prelease -Dgpg.skip=true -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" verify
          mkdir candidate
          cp target/webpbridge-*.jar candidate/
          cp pom.xml "candidate/webpbridge-$RELEASE_VERSION.pom"
          cd candidate
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error
  verify-bundle:
    needs: assemble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        java: ['17', '25']
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
      - shell: bash
        run: |
          cd candidate
          sha256sum -c SHA256SUMS
          cd ..
          mvn --batch-mode test-compile failsafe:integration-test failsafe:verify -Dwebpbridge.test.jar="$GITHUB_WORKSPACE/candidate/webpbridge-$RELEASE_VERSION.jar"
  publish:
    if: inputs.publish
    needs: [validate, verify-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.timestamp }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required credentials
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$MAVEN_USERNAME" && test -n "$MAVEN_PASSWORD" && test -n "$MAVEN_GPG_PASSPHRASE" && test -n "$GPG_KEY" || { echo 'Missing Maven Central or GPG secrets'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: actions/download-artifact@v4
        with:
          pattern: release-native-*
          path: native-input
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
      - run: python3 scripts/assemble_natives.py native-input target/classes
      - shell: bash
        run: |
          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.19.1:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode -Prelease -Dgpg.skip=true -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" verify
          cmp "candidate/webpbridge-$RELEASE_VERSION.jar" "target/webpbridge-$RELEASE_VERSION.jar"
          cmp "candidate/webpbridge-$RELEASE_VERSION-sources.jar" "target/webpbridge-$RELEASE_VERSION-sources.jar"
          cmp "candidate/webpbridge-$RELEASE_VERSION-javadoc.jar" "target/webpbridge-$RELEASE_VERSION-javadoc.jar"
          cmp "candidate/webpbridge-$RELEASE_VERSION.pom" pom.xml
          mvn --batch-mode -Prelease,central -DskipTests -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" deploy
